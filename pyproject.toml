[project]
name = "expressvision"
version = "0.1.0"
description = "Passive video analysis for pest detection and movement monitoring"
requires-python = ">=3.12"
dependencies = [
    # headless, not opencv-python: we never call cv2.imshow or any GUI function,
    # and the GUI build needs libGL which servers and edge images often lack.
    # Identical API, smaller, and it imports on a headless DGX or a Jetson.
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "scipy>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.scripts]
exv = "expressvision.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "httpx>=0.27"]
# Operator console. Optional so the collector, the CLI and the tests all run on
# an edge node that only needs to collect — the console is a surface on top of
# the store, never a dependency of producing one.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# Detector training. GPU-only in practice, and deliberately separate from the
# collector: an edge node that only collects must not carry a training stack.
# RT-DETR and transformers are both Apache-2.0 - see the licence boundary in
# CONTEXT.md. Nothing here may pull an AGPL detector family.
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "accelerate>=0.34",
    "timm>=1.0",
]
# Third-party model evaluation only. Used by experiments/roboflow_eval/, which
# nothing in src/expressvision imports. Not a production dependency: the hosted
# API needs the internet, sends client footage to a third party, and costs a
# network round trip per tile — see experiments/roboflow_eval/FINDINGS.md.
experimental = ["inference-sdk>=1.4"]
# Bootstrap detection model. Kept optional so the collector, the tests and the
# CLI all run without torch — only `--detector megadetector` needs this.
#
# LICENCE BOUNDARY: PytorchWildlife depends on ultralytics and yolov5, both
# AGPL-3.0, whichever model weights you select. This extra is therefore for the
# INTERNAL harvest and labelling phase only. It must never be installed into an
# edge node shipped to a client. See README, "Where MegaDetector may run".
#
# soundfile is an undeclared transitive dependency of PytorchWildlife — its
# package __init__ eagerly imports a bioacoustics module that needs it.
ml = [
    "PytorchWildlife>=1.3",
    "torch>=2.4",
    "torchvision>=0.19",
    # Undeclared transitive deps of PytorchWildlife: its package __init__
    # eagerly imports a bioacoustics module needing soundfile and librosa,
    # neither of which detection uses.
    "soundfile>=0.12",
    "librosa>=0.10",
    # setuptools 81 removed pkg_resources; the vendored yolov5 still imports it.
    "setuptools<81",
]

[tool.uv]
# `experimental` and `ml` cannot coexist: PytorchWildlife pins supervision
# ==0.23.0 and inference-sdk requires >=0.26. Declaring the conflict lets uv
# lock each extra separately instead of failing to resolve the whole project.
# They are never needed together anyway — one is the MegaDetector bootstrap,
# the other is the Roboflow evaluation in experiments/, and nothing in src/
# imports either.
conflicts = [[{ extra = "experimental" }, { extra = "ml" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expressvision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# gpu.py probes optional, environment-dependent machinery: torch may be absent
# or a CPU build, CUDA may be present but unusable, NVML may be missing or a
# different version than the driver. Every one of those must produce a report
# rather than an exception, so broad excepts are the intended behaviour here.
"src/expressvision/gpu.py" = ["BLE001", "S110"]
# Tests reach into internals deliberately to assert on private behaviour.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
